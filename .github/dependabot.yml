version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /Packaging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Packaging/requirements.txt supports the Python 3.9 shipped with older Command Line
    # Tools. These releases and everything after them require Python 3.10 (pip refuses
    # to resolve them on 3.9). Drop these entries when the 3.9 requirement goes.
    ignore:
      - dependency-name: dmgbuild
        versions: [">=1.6.6"]
      - dependency-name: ds-store
        versions: [">=1.3.2"]
      - dependency-name: mac-alias
        versions: [">=2.2.3"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
