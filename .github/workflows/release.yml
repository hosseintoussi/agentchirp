name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: signed-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Find version tag on this commit
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$' | head -1 || true)
          if [ -n "$TAG" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
            VERSION=$(sed -n 's/public let appVersion = "\(.*\)"/\1/p' Sources/AgentChirpCore/Version.swift)
            test "$TAG" = "v$VERSION"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: candidate
    if: needs.candidate.outputs.tag != ''
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Prepare signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          python3 scripts/ci_credentials.py

      - name: Build signed universal app
        env:
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: python3 scripts/package_app.py

      - name: Verify bundled app before notarization
        run: |
          python3 Tests/Release/test_bundle.py dist/AgentChirp.app
          dist/AgentChirp.app/Contents/MacOS/agentchirp --ui-check
          dist/AgentChirp.app/Contents/MacOS/agentchirp --installation-check

      - name: Notarize and package
        env:
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          python3 -m venv .build/packaging-venv
          .build/packaging-venv/bin/pip install -r Packaging/requirements.txt
          python3 scripts/distribute.py --notary-profile agentchirp-release --identity "$DEVELOPER_ID_APPLICATION"
          python3 Tests/Release/test_dmg.py

      - name: Generate signed update feed and release notes
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          python3 scripts/sparkle_tools.py
          python3 scripts/appcast.py "dist/AgentChirp-${RELEASE_TAG#v}.zip" --key-file "$RUNNER_TEMP/sparkle-private-key"
          python3 Tests/Release/test_update_signature.py "dist/AgentChirp-${RELEASE_TAG#v}.zip"
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from appcast import changelog; from package_app import version; print(changelog(version()))' > dist/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.candidate.outputs.tag }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.candidate.outputs.tag, '-rc.') }}
          make_latest: ${{ contains(needs.candidate.outputs.tag, '-rc.') && 'false' || 'legacy' }}
          name: AgentChirp ${{ needs.candidate.outputs.tag }}
          files: |
            dist/AgentChirp.dmg
            dist/AgentChirp-*.zip
            dist/appcast.xml

      - name: Remove temporary signing credentials
        if: always()
        run: python3 scripts/ci_credentials.py --cleanup
