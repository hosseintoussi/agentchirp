name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: |
          swift run CCBeaconTests
          bash -n ccbeacon.sh
          python3 Tests/Hooks/test_codex.py

      - name: Native UI and popover layout regressions
        run: .build/release/ccbeacon --ui-check
